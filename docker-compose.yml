services:
  backend:
    build: ./backend
    container_name: mirofish-am-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: mirofish-am-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
